<router-outlet />

<div class="wrapper">
  <div class="box">
    <app-sidebar />

    @switch (steps()) {
      @case ("step1") {
        <app-personal-info [group]="form.controls.step1" (next)="nextStep()" />
      }
      @case ("step2") {
        <app-select-plan (next)="nextStep()" />
      }
      @case ("step3") {
        <app-add-ons (next)="nextStep()" />
      }
      @case ("summary") {
        <app-summary />
      }
    }
  </div>
</div>
