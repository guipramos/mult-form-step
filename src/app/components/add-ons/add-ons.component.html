<section class="info">
  <header class="info-header">
    <h1>Pick add-ons</h1>
    <p>Add-ons help enhance your gaming experience.</p>
  </header>

  <form class="info-form">
    <div class="addons">
      <label class="addon">
        <input type="checkbox" name="addon" value="online-service" />
        <span class="addon-card">
          <span class="addon-check" aria-hidden="true"></span>
          <span class="addon-text">
            <span class="addon-name">Online service</span>
            <span class="addon-desc">Access to multiplayer games</span>
          </span>
          <span class="addon-price">+$1/mo</span>
        </span>
      </label>

      <label class="addon">
        <input type="checkbox" name="addon" value="larger-storage" />
        <span class="addon-card">
          <span class="addon-check" aria-hidden="true"></span>
          <span class="addon-text">
            <span class="addon-name">Larger storage</span>
            <span class="addon-desc">Extra 1TB of cloud save</span>
          </span>
          <span class="addon-price">+$2/mo</span>
        </span>
      </label>

      <label class="addon">
        <input type="checkbox" name="addon" value="custom-profile" />
        <span class="addon-card">
          <span class="addon-check" aria-hidden="true"></span>
          <span class="addon-text">
            <span class="addon-name">Customizable profile</span>
            <span class="addon-desc">Custom theme on your profile</span>
          </span>
          <span class="addon-price">+$2/mo</span>
        </span>
      </label>
    </div>

    <div class="actions">
      <button type="button" class="btn-back">Go Back</button>
      <app-next-button (clicked)="next.emit()" />
    </div>
  </form>
</section>
